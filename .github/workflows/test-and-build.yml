name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

  build-test:
    name: Test Build (Linux)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install pyinstaller

      - name: Test PyInstaller build
        run: |
          uv run pyinstaller \
            --name PySQL \
            --windowed \
            --onedir \
            --paths src \
            --collect-all mysql.connector \
            --clean \
            src/pysql/__main__.py

      - name: Verify build artifacts
        run: |
          test -f dist/PySQL/PySQL && echo "Executable exists" || exit 1
          test -d dist/PySQL/_internal && echo "Internal files exist" || exit 1

      - name: Clean up build artifacts
        if: always()
        run: rm -rf build/ dist/